<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webamp Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
  <!-- Webamp CDN Kütüphanesi -->
  <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
</head>
<body>
  <div id="webamp-app"></div>

  <script>
    const Webamp = window.Webamp;

    if (Webamp.browserIsSupported()) {
      const webamp = new Webamp({
        // Aynı depodaki Rei Ayanami temasının dosya adı
        initialSkin: {
          url: "Neon Genesis Evangelion - Misato Cheap Thrills.wsz"
        },
        initialTracks: [
          {
            metaData: {
              artist: "Evangelion",
              title: "Misato Theme"
            },
            // Müzik dosyanın doğrudan linki veya repoya ekleyeceğin bir mp3 adı
            url: "https://raw.githubusercontent.com/captbaritone/webamp/master/packages/webamp/demo/mp3/llama-2.29.mp3",
            duration: 5
          }
        ]
      });

      webamp.renderWhenReady(document.getElementById('webamp-app'));
    }
  </script>
</body>
</html>
